name: Apply Android 15 vendor pruning

on:
  push:
    branches:
      - lineage-22.2-android15-contract
    paths:
      - tools/prune_android15_contract.py

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic pruning
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prune_android15_contract.py

      - name: Verify contract before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool proprietary-manifest.json >/dev/null
          python3 -m json.tool SOURCE_LOCK.json >/dev/null
          python3 -m json.tool GENERATED_VENDOR_AUDIT.json >/dev/null
          python3 -m json.tool VENDOR_TREE_AUDIT.json >/dev/null
          python3 -m json.tool ANDROID15_PRUNE_REPORT.json >/dev/null
          python3 -m unittest -v tests.test_android15_contract
          git diff --check

      - name: Commit verified pruning
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No pruning changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'vendor: prune source-owned Android 9 wrappers'
          git push origin HEAD:lineage-22.2-android15-contract
