name: Apply RED faceproc LIBC_PRIVATE fix

on:
  push:
    branches:
      - codex/faceproc-libc-private-staging

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/faceproc-libc-private-staging
          fetch-depth: 0

      - name: Install pinned-compatible patchelf
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          patchelf --version
          patchelf --version | grep -Eq '0\.18(\.0)?'

      - name: RED then GREEN exact RED faceproc LIBC_PRIVATE adaptation
        shell: bash
        run: |
          set -euo pipefail

          cat > tests/test_faceproc_libc_private_fixup.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          TARGET_REL = "vendor/lib/libmmcamera_faceproc.so"
          TARGET = ROOT / "proprietary" / TARGET_REL
          TARGET64_REL = "vendor/lib64/libmmcamera_faceproc.so"
          TARGET64 = ROOT / "proprietary" / TARGET64_REL
          REGISTRY = ROOT / "ANDROID15_FACEPROC_LIBC_PRIVATE_FIXUP.json"
          STOCK_SIZE = 1246820
          STOCK_SHA256 = "388cd36dcd54f7c3842c8178ad0888fabbed045f791de0d6d3c3c29876c3a056"
          STOCK64_SIZE = 1312840
          STOCK64_SHA256 = "e5aad3eb48220d4a5ef98bf4ba7a56bba846e231857a51f51fb76e8cd8bafed6"
          SYMBOLS = (
              "__aeabi_memcpy",
              "__aeabi_memset",
              "__gnu_Unwind_Find_exidx",
          )

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def dyn_symbols(path: Path) -> str:
              return subprocess.check_output(
                  ["readelf", "--dyn-syms", "--wide", str(path)], text=True
              )

          def module_block(name: str) -> str:
              text = (ROOT / "Android.bp").read_text()
              match = re.search(
                  rf'cc_prebuilt_library_shared\s*\{{(?:(?!\n\}}).)*?name:\s*"{re.escape(name)}"(?:(?!\n\}}).)*?\n\}}',
                  text,
                  re.S,
              )
              if match is None:
                  raise AssertionError(f"missing Android.bp module: {name}")
              return match.group(0)

          class FaceprocLibcPrivateFixupTest(unittest.TestCase):
              def test_manifest_keeps_exact_red118_stock_identity(self):
                  manifest = json.loads((ROOT / "proprietary-manifest.json").read_text())
                  entry = next(e for e in manifest["files"] if e["path"] == TARGET_REL)
                  self.assertEqual(entry["size"], STOCK_SIZE)
                  self.assertEqual(entry["sha256"], STOCK_SHA256)
                  entry64 = next(e for e in manifest["files"] if e["path"] == TARGET64_REL)
                  self.assertEqual(entry64["size"], STOCK64_SIZE)
                  self.assertEqual(entry64["sha256"], STOCK64_SHA256)

              def test_arm32_runtime_payload_clears_only_obsolete_libc_private_versions(self):
                  dyn = dyn_symbols(TARGET)
                  for symbol in SYMBOLS:
                      lines = [line for line in dyn.splitlines() if " UND " in line and symbol in line]
                      self.assertTrue(lines, symbol)
                      self.assertFalse(any(f"{symbol}@LIBC_PRIVATE" in line for line in lines), lines)
                  self.assertNotIn("@LIBC_PRIVATE", "\n".join(
                      line for line in dyn.splitlines() if any(symbol in line for symbol in SYMBOLS)
                  ))

              def test_arm64_faceproc_remains_exact_stock_blob(self):
                  self.assertEqual(TARGET64.stat().st_size, STOCK64_SIZE)
                  self.assertEqual(sha256(TARGET64), STOCK64_SHA256)

              def test_fixup_registry_pins_original_and_patched_identity(self):
                  data = json.loads(REGISTRY.read_text())
                  self.assertEqual(data["schema_version"], 1)
                  self.assertEqual(data["path"], TARGET_REL)
                  self.assertEqual(data["operation"], "clear_symbol_versions")
                  self.assertEqual(data["symbols"], list(SYMBOLS))
                  self.assertEqual(data["stock_size"], STOCK_SIZE)
                  self.assertEqual(data["stock_sha256"], STOCK_SHA256)
                  self.assertEqual(data["patched_size"], TARGET.stat().st_size)
                  self.assertEqual(data["patched_sha256"], sha256(TARGET))

              def test_checkelf_stays_enabled_and_no_undefined_escape_is_added(self):
                  block = module_block("libmmcamera_faceproc")
                  self.assertNotIn("check_elf_files: false", block)
                  self.assertNotIn("allow_undefined_symbols: true", block)
                  self.assertIn('"libc",', block)

              def test_pipeline_applies_fixup_before_final_elf_generation(self):
                  text = (ROOT / "tools/apply_android15_vendor_contract.py").read_text()
                  self.assertEqual(text.count('"patch_faceproc_libc_private.py",'), 2)
                  for marker in ("BASELINE_PIPELINE", "POST_CAMERA_PIPELINE"):
                      section = text.split(marker, 1)[1].split(")", 1)[0]
                      self.assertLess(
                          section.index('"patch_imsdatadaemon_hwbinder.py",'),
                          section.index('"patch_faceproc_libc_private.py",'),
                      )
                      self.assertLess(
                          section.index('"patch_faceproc_libc_private.py",'),
                          section.rindex('"generate_elf_contract.py",'),
                      )

          if __name__ == "__main__":
              unittest.main()
          PY

          set +e
          python3 -m unittest tests.test_faceproc_libc_private_fixup -v > /tmp/faceproc-red.log 2>&1
          red_rc=$?
          set -e
          cat /tmp/faceproc-red.log
          if [ "$red_rc" -eq 0 ]; then
            echo "ERROR: RED faceproc test unexpectedly passed before fix"
            exit 1
          fi
          grep -Eq 'FAILED|ERROR|LIBC_PRIVATE|No such file' /tmp/faceproc-red.log

          cat > tools/patch_faceproc_libc_private.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          STOCK_ARCHIVE_SHA256 = "7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e"
          TARGET_REL = "vendor/lib/libmmcamera_faceproc.so"
          TARGET = ROOT / "proprietary" / TARGET_REL
          TARGET64_REL = "vendor/lib64/libmmcamera_faceproc.so"
          TARGET64 = ROOT / "proprietary" / TARGET64_REL
          REGISTRY = ROOT / "ANDROID15_FACEPROC_LIBC_PRIVATE_FIXUP.json"
          STOCK_SIZE = 1246820
          STOCK_SHA256 = "388cd36dcd54f7c3842c8178ad0888fabbed045f791de0d6d3c3c29876c3a056"
          STOCK64_SIZE = 1312840
          STOCK64_SHA256 = "e5aad3eb48220d4a5ef98bf4ba7a56bba846e231857a51f51fb76e8cd8bafed6"
          SYMBOLS = (
              "__aeabi_memcpy",
              "__aeabi_memset",
              "__gnu_Unwind_Find_exidx",
          )

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def load_json(path: Path) -> dict:
              return json.loads(path.read_text(encoding="utf-8"))

          def write_json(path: Path, value: dict) -> None:
              path.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")

          def dyn_symbols(path: Path) -> str:
              return subprocess.run(
                  ["readelf", "--dyn-syms", "--wide", str(path)],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

          def symbol_lines(path: Path, symbol: str) -> list[str]:
              return [
                  line for line in dyn_symbols(path).splitlines()
                  if " UND " in line and symbol in line
              ]

          def resolve_patchelf(explicit: str | None) -> Path:
              candidates: list[Path] = []
              if explicit:
                  candidates.append(Path(explicit))
              top = os.environ.get("ANDROID_BUILD_TOP")
              if top:
                  candidates.append(Path(top) / "prebuilts/extract-tools/linux-x86/bin/patchelf-0_18")
              candidates.append(ROOT.parents[2] / "prebuilts/extract-tools/linux-x86/bin/patchelf-0_18")
              system = shutil.which("patchelf")
              if system:
                  candidates.append(Path(system))
              for path in candidates:
                  if not (path.is_file() and os.access(path, os.X_OK)):
                      continue
                  version = subprocess.check_output([str(path), "--version"], text=True).strip()
                  if "0.18" in version or path.name == "patchelf-0_18":
                      return path.resolve()
              raise SystemExit("patchelf 0.18 not found")

          def verify_stock_authority() -> None:
              manifest = load_json(ROOT / "proprietary-manifest.json")
              if manifest.get("canonical_stock", {}).get("sha256") != STOCK_ARCHIVE_SHA256:
                  raise SystemExit("unexpected canonical stock authority")
              entries = {e["path"]: e for e in manifest["files"]}
              entry = entries.get(TARGET_REL)
              if entry is None or entry.get("size") != STOCK_SIZE or entry.get("sha256") != STOCK_SHA256:
                  raise SystemExit(f"canonical RED .118 ARM faceproc identity mismatch: {entry}")
              entry64 = entries.get(TARGET64_REL)
              if entry64 is None or entry64.get("size") != STOCK64_SIZE or entry64.get("sha256") != STOCK64_SHA256:
                  raise SystemExit(f"canonical RED .118 ARM64 faceproc identity mismatch: {entry64}")
              if TARGET64.stat().st_size != STOCK64_SIZE or digest(TARGET64) != STOCK64_SHA256:
                  raise SystemExit("ARM64 faceproc changed; fixup must remain ARM32-only")

          def validate_symbol_surface(path: Path, require_private: bool) -> None:
              for symbol in SYMBOLS:
                  lines = symbol_lines(path, symbol)
                  if not lines:
                      raise SystemExit(f"missing expected faceproc import: {symbol}")
                  has_private = any(f"{symbol}@LIBC_PRIVATE" in line for line in lines)
                  if has_private != require_private:
                      state = "versioned" if require_private else "unversioned"
                      raise SystemExit(f"faceproc {symbol} is not in expected {state} state: {lines}")

          def verify_patched_registry(current_hash: str, current_size: int) -> dict:
              if not REGISTRY.is_file():
                  raise SystemExit("faceproc is patched but fixup registry is missing")
              data = load_json(REGISTRY)
              expected = {
                  "schema_version": 1,
                  "stock_archive_sha256": STOCK_ARCHIVE_SHA256,
                  "path": TARGET_REL,
                  "operation": "clear_symbol_versions",
                  "symbols": list(SYMBOLS),
                  "stock_size": STOCK_SIZE,
                  "stock_sha256": STOCK_SHA256,
              }
              for key, value in expected.items():
                  if data.get(key) != value:
                      raise SystemExit(f"faceproc fixup registry mismatch for {key}: {data.get(key)!r}")
              if data.get("patched_size") != current_size or data.get("patched_sha256") != current_hash:
                  raise SystemExit("patched faceproc identity mismatch")
              return data

          def update_metadata(record: dict) -> None:
              source_lock_path = ROOT / "SOURCE_LOCK.json"
              source_lock = load_json(source_lock_path)
              source_lock.setdefault("android15_contract", {})["faceproc_libc_private_fixup"] = {
                  "path": TARGET_REL,
                  "operation": "clear_symbol_versions",
                  "symbols": list(SYMBOLS),
                  "stock_sha256": STOCK_SHA256,
                  "patched_sha256": record["patched_sha256"],
              }
              write_json(source_lock_path, source_lock)

              generated_path = ROOT / "GENERATED_VENDOR_AUDIT.json"
              generated = load_json(generated_path)
              manifest = load_json(ROOT / "proprietary-manifest.json")
              generated["actual_selected_bytes_after_fixups"] = sum(
                  (ROOT / "proprietary" / e["path"]).stat().st_size
                  for e in manifest["files"]
                  if (ROOT / "proprietary" / e["path"]).is_file()
              )
              generated["faceproc_libc_private_fixups"] = 1
              write_json(generated_path, generated)

              tree_path = ROOT / "VENDOR_TREE_AUDIT.json"
              tree = load_json(tree_path)
              notes = list(tree.get("notes", []))
              note = (
                  "RED .118 ARM32 libmmcamera_faceproc.so imports __aeabi_memcpy, "
                  "__aeabi_memset and __gnu_Unwind_Find_exidx with the obsolete "
                  "LIBC_PRIVATE symbol version. LineageOS 22.2 cheryl, mata and "
                  "OnePlus msm8998-common clear those exact symbol versions; the "
                  "Hydrogen One keeps its stock camera blob and applies the same "
                  "ARM32-only compatibility fixup with original/patched identities pinned."
              )
              if note not in notes:
                  notes.append(note)
              tree["notes"] = notes
              write_json(tree_path, tree)

          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--patchelf")
              args = parser.parse_args()

              verify_stock_authority()
              if not TARGET.is_file():
                  raise SystemExit(f"missing faceproc payload: {TARGET_REL}")

              current_hash = digest(TARGET)
              current_size = TARGET.stat().st_size

              if current_hash == STOCK_SHA256 and current_size == STOCK_SIZE:
                  validate_symbol_surface(TARGET, require_private=True)
                  patchelf = resolve_patchelf(args.patchelf)
                  for symbol in SYMBOLS:
                      subprocess.run(
                          [str(patchelf), "--clear-symbol-version", symbol, str(TARGET)],
                          check=True,
                      )
              else:
                  verify_patched_registry(current_hash, current_size)

              validate_symbol_surface(TARGET, require_private=False)
              record = {
                  "schema_version": 1,
                  "stock_archive_sha256": STOCK_ARCHIVE_SHA256,
                  "path": TARGET_REL,
                  "operation": "clear_symbol_versions",
                  "symbols": list(SYMBOLS),
                  "stock_size": STOCK_SIZE,
                  "stock_sha256": STOCK_SHA256,
                  "patched_size": TARGET.stat().st_size,
                  "patched_sha256": digest(TARGET),
              }
              write_json(REGISTRY, record)
              update_metadata(record)
              print(
                  "Applied RED ARM32 faceproc LIBC_PRIVATE compatibility fixup; "
                  f"patched_sha256={record['patched_sha256']}"
              )
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x tools/patch_faceproc_libc_private.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_android15_vendor_contract.py")
          text = path.read_text()
          needle = '    "patch_imsdatadaemon_hwbinder.py",\n'
          if text.count(needle) != 2:
              raise SystemExit(f"expected two imsdatadaemon pipeline anchors, got {text.count(needle)}")
          text = text.replace(
              needle,
              needle + '    "patch_faceproc_libc_private.py",\n',
          )
          path.write_text(text)
          PY

          python3 tools/apply_android15_vendor_contract.py

          python3 -m unittest tests.test_faceproc_libc_private_fixup -v

          git diff --binary -- . ':!.github/workflows/apply-faceproc-libc-private-fix.yml' > /tmp/faceproc-state-1.diff
          python3 tools/apply_android15_vendor_contract.py
          git diff --binary -- . ':!.github/workflows/apply-faceproc-libc-private-fix.yml' > /tmp/faceproc-state-2.diff
          cmp /tmp/faceproc-state-1.diff /tmp/faceproc-state-2.diff

          python3 -m unittest discover -s tests -v

          python3 - <<'PY'
          import subprocess
          allowed = {
              "ANDROID15_ELF_AUDIT.json",
              "ANDROID15_FACEPROC_LIBC_PRIVATE_FIXUP.json",
              "Android.bp",
              "GENERATED_VENDOR_AUDIT.json",
              "SOURCE_LOCK.json",
              "VENDOR_TREE_AUDIT.json",
              "proprietary/vendor/lib/libmmcamera_faceproc.so",
              "tests/test_faceproc_libc_private_fixup.py",
              "tools/apply_android15_vendor_contract.py",
              "tools/patch_faceproc_libc_private.py",
          }
          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          changed = set()
          for line in out.splitlines():
              path = line[3:]
              if path == ".github/workflows/apply-faceproc-libc-private-fix.yml":
                  continue
              changed.add(path)
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"unexpected production changes: {sorted(unexpected)}")
          required = {
              "ANDROID15_FACEPROC_LIBC_PRIVATE_FIXUP.json",
              "proprietary/vendor/lib/libmmcamera_faceproc.so",
              "tests/test_faceproc_libc_private_fixup.py",
              "tools/apply_android15_vendor_contract.py",
              "tools/patch_faceproc_libc_private.py",
          }
          missing = required - changed
          if missing:
              raise SystemExit(f"missing expected production changes: {sorted(missing)}")
          print("production_changes=", sorted(changed))
          PY

      - name: Commit verified production changes to staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/apply-faceproc-libc-private-fix.yml
          git commit -m 'vendor: clear RED faceproc legacy libc symbol versions'
          git push origin HEAD:codex/faceproc-libc-private-staging
