name: Verify Android 15 vendor contract

on:
  push:
    branches:
      - codex/lineage-22.2-bringup-audit
      - lineage-22.2-android15-contract
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate committed machine-readable metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool proprietary-manifest.json >/dev/null
          python3 -m json.tool SOURCE_LOCK.json >/dev/null
          python3 -m json.tool GENERATED_VENDOR_AUDIT.json >/dev/null
          python3 -m json.tool VENDOR_TREE_AUDIT.json >/dev/null
          python3 -m json.tool ANDROID15_ELF_AUDIT.json >/dev/null
          python3 -m json.tool ANDROID15_ELF_EXCEPTIONS.json >/dev/null
          python3 -m json.tool ANDROID15_BLOB_FIXUPS.json >/dev/null
          python3 -m json.tool VINTF_PROPRIETARY_CONTRACT.json >/dev/null
          test ! -f ANDROID15_PRUNE_REPORT.json || python3 -m json.tool ANDROID15_PRUNE_REPORT.json >/dev/null

      - name: Apply complete Android 15 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_android15_vendor_contract.py

      - name: Verify generated Android 15 ownership and HIDL contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('proprietary-manifest.json').read_text())
          lock = json.loads(Path('SOURCE_LOCK.json').read_text())
          audit = json.loads(Path('GENERATED_VENDOR_AUDIT.json').read_text())
          fixups = json.loads(Path('ANDROID15_BLOB_FIXUPS.json').read_text())
          elf_audit = json.loads(Path('ANDROID15_ELF_AUDIT.json').read_text())
          exceptions = json.loads(Path('ANDROID15_ELF_EXCEPTIONS.json').read_text())['exceptions']

          expected_counts = {'P0': 105, 'P1': 341, 'P2': 19, 'total': 465}
          assert manifest['counts'] == expected_counts, manifest['counts']
          assert lock['stock_build'] == 'H1A1000.082ho.01.00.10r.118', lock
          assert lock['stock_archive_sha256'] == '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e', lock
          assert lock['selected_files'] == 465, lock['selected_files']
          assert audit['selected_files'] == 465, audit
          assert audit['p0'] == 105 and audit['p1'] == 341 and audit['p2'] == 19, audit
          assert audit['selected_bytes'] == 239856354, audit['selected_bytes']
          assert audit['missing_files'] == [], audit['missing_files']
          assert audit['duplicate_paths'] == 0, audit['duplicate_paths']
          assert audit['sensitive_path_matches'] == [], audit['sensitive_path_matches']
          assert audit['elf_modules'] == 317, audit['elf_modules']
          assert audit['checkelf_enabled'] == 312, audit['checkelf_enabled']
          assert audit['checkelf_exceptions'] == 5, audit['checkelf_exceptions']
          assert elf_audit['summary']['total_modules'] == 317, elf_audit['summary']
          assert elf_audit['summary']['checkelf_enabled'] == 312, elf_audit['summary']
          assert elf_audit['summary']['checkelf_exceptions'] == 5, elf_audit['summary']
          assert len(exceptions) == 5, exceptions
          assert 'libaudiopreprocessing' not in exceptions
          assert 'libwebrtc_audio_preprocessing' not in elf_audit['modules']
          assert lock['android15_contract']['obsolete_audio_preprocessing_pruned'] is True
          assert lock['android15_contract']['source_owned_audio_preprocessing_package'] == 'libaudiopreprocessing'
          assert fixups['consumer_count'] == 63, fixups['consumer_count']
          assert fixups['fixup'] == 'add_needed:libhidlbase_shim.so', fixups['fixup']
          assert lock['android15_contract']['legacy_hidlbase_shim_fixup']['consumer_count'] == 63
          assert audit['android15_blob_fixups'] == 63
          assert audit['actual_selected_bytes_after_fixups'] >= audit['selected_bytes']
          print('ANDROID15 GENERATED VENDOR CONTRACT: PASS')
          PY

      - name: Run Android 15 contract tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

      - name: Verify contract pipeline idempotency
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > "$RUNNER_TEMP/first.patch"
          python3 tools/apply_android15_vendor_contract.py
          git diff --binary > "$RUNNER_TEMP/second.patch"
          cmp "$RUNNER_TEMP/first.patch" "$RUNNER_TEMP/second.patch"
          echo 'ANDROID15 PIPELINE IDEMPOTENCY: PASS'
