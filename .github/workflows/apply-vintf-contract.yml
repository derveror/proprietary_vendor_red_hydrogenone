name: Apply proprietary VINTF contract

on:
  push:
    branches:
      - lineage-22.2-android15-contract
    paths:
      - .github/workflows/apply-vintf-contract.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate exact RED .118 VINTF fragments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          ROOT = Path('.')
          VINTF = ROOT / 'vintf'
          VINTF.mkdir(exist_ok=True)

          contract = {
              'android.hardware.biometrics.fingerprint@2.1-service': {
                  'file': 'vintf/fingerprint.xml',
                  'hals': {
                      'android.hardware.biometrics.fingerprint': ['@2.1::IBiometricsFingerprint/default'],
                      'com.fingerprints.extension': ['@1.0::IFingerprintSensorTest/default'],
                  },
              },
              'android.hardware.bluetooth@1.0-service-qti': {
                  'file': 'vintf/bluetooth.xml',
                  'hals': {
                      'android.hardware.bluetooth': ['@1.0::IBluetoothHci/default'],
                      'com.qualcomm.qti.ant': ['@1.0::IAntHci/default'],
                      'vendor.qti.hardware.fm': ['@1.0::IFmHci/default'],
                  },
              },
              'android.hardware.media.omx@1.0-service': {
                  'file': 'vintf/media-omx.xml',
                  'hals': {
                      'android.hardware.media.omx': ['@1.0::IOmx/default', '@1.0::IOmxStore/default'],
                  },
              },
              'wifidisplayhalservice': {
                  'file': 'vintf/wifidisplay.xml',
                  'hals': {
                      'com.qualcomm.qti.wifidisplayhal': ['@1.0::IDSManager/wifidisplaydshal', '@1.0::IHDCPSession/wifidisplayhdcphal'],
                  },
              },
              'vendor.cm.hardware.thermal3d@1.0-service.cm': {
                  'file': 'vintf/thermal3d.xml',
                  'hals': {
                      'vendor.cm.hardware.thermal3d': ['@1.0::IThermal3d/default'],
                  },
              },
              'vendor.leia.hardware.leiadisp@1.0-service': {
                  'file': 'vintf/leia.xml',
                  'hals': {
                      'vendor.leia.hardware.leiadisp': ['@1.0::ILeiadisp/default'],
                  },
              },
              'vendor.qti.esepowermanager@1.0-service': {
                  'file': 'vintf/esepowermanager.xml',
                  'hals': {
                      'vendor.qti.esepowermanager': ['@1.0::IEsePowerManager/default'],
                  },
              },
              'qcrild': {
                  'file': 'vintf/radio.xml',
                  'hals': {
                      'android.hardware.radio': ['@1.1::IRadio/slot1', '@1.1::IRadio/slot2', '@1.1::ISap/slot1', '@1.1::ISap/slot2'],
                      'android.hardware.radio.config': ['@1.0::IRadioConfig/default'],
                      'android.hardware.secure_element': ['@1.0::ISecureElement/SIM1', '@1.0::ISecureElement/SIM2'],
                      'vendor.qti.hardware.radio.am': ['@1.0::IQcRilAudio/slot1', '@1.0::IQcRilAudio/slot2'],
                      'vendor.qti.hardware.radio.ims': ['@1.0::IImsRadio/imsradio0', '@1.0::IImsRadio/imsradio1'],
                      'vendor.qti.hardware.radio.lpa': ['@1.0::IUimLpa/UimLpa0', '@1.0::IUimLpa/UimLpa1'],
                      'vendor.qti.hardware.radio.qcrilhook': ['@1.0::IQtiOemHook/oemhook0', '@1.0::IQtiOemHook/oemhook1'],
                      'vendor.qti.hardware.radio.qtiradio': ['@1.0::IQtiRadio/slot1', '@1.0::IQtiRadio/slot2'],
                      'vendor.qti.hardware.radio.uim': ['@1.1::IUim/Uim0', '@1.1::IUim/Uim1'],
                      'vendor.qti.hardware.radio.uim_remote_client': ['@1.0::IUimRemoteServiceClient/uimRemoteClient0', '@1.0::IUimRemoteServiceClient/uimRemoteClient1'],
                      'vendor.qti.hardware.radio.uim_remote_server': ['@1.0::IUimRemoteServiceServer/uimRemoteServer0', '@1.0::IUimRemoteServiceServer/uimRemoteServer1'],
                  },
              },
          }

          total = 0
          for module, spec in contract.items():
              root = ET.Element('manifest', {'version': '1.0', 'type': 'device'})
              for name, fqnames in spec['hals'].items():
                  hal = ET.SubElement(root, 'hal', {'format': 'hidl'})
                  ET.SubElement(hal, 'name').text = name
                  ET.SubElement(hal, 'transport').text = 'hwbinder'
                  for fqname in fqnames:
                      ET.SubElement(hal, 'fqname').text = fqname
                      total += 1
              ET.indent(root, space='    ')
              path = ROOT / spec['file']
              path.write_text('<?xml version="1.0" encoding="utf-8"?>\n' + ET.tostring(root, encoding='unicode') + '\n')

          if total != 35:
              raise SystemExit(f'expected 35 proprietary stock fqnames, got {total}')

          machine = {
              'schema_version': 1,
              'stock_archive_sha256': '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e',
              'target': 'LineageOS 22.2 / Android 15 API 35',
              'source_owned_exclusions': ['android.hardware.gnss', 'android.hardware.nfc'],
              'proprietary_fqname_count': total,
              'modules': contract,
          }
          Path('VINTF_PROPRIETARY_CONTRACT.json').write_text(json.dumps(machine, indent=2) + '\n')

          generator = Path('tools/generate_elf_contract.py')
          source = generator.read_text()
          constant = '''\nVINTF_FRAGMENT_BY_MODULE = {\n    "android.hardware.biometrics.fingerprint@2.1-service": "vintf/fingerprint.xml",\n    "android.hardware.bluetooth@1.0-service-qti": "vintf/bluetooth.xml",\n    "android.hardware.media.omx@1.0-service": "vintf/media-omx.xml",\n    "wifidisplayhalservice": "vintf/wifidisplay.xml",\n    "vendor.cm.hardware.thermal3d@1.0-service.cm": "vintf/thermal3d.xml",\n    "vendor.leia.hardware.leiadisp@1.0-service": "vintf/leia.xml",\n    "vendor.qti.esepowermanager@1.0-service": "vintf/esepowermanager.xml",\n    "qcrild": "vintf/radio.xml",\n}\n'''
          if 'VINTF_FRAGMENT_BY_MODULE' not in source:
              marker = 'SOURCE_VERIFIED_DEPENDENCIES = {\n    "libgnsspps",\n    "libminijail",\n}\n'
              if marker not in source:
                  raise SystemExit('source dependency anchor not found')
              source = source.replace(marker, marker + constant, 1)

          if 'fragment = VINTF_FRAGMENT_BY_MODULE.get(block["name"])' not in source:
              marker = '    if is_exception:\n        out.append("    check_elf_files: false,")\n    out.append("    target: {")\n'
              replacement = '''    if is_exception:\n        out.append("    check_elf_files: false,")\n    fragment = VINTF_FRAGMENT_BY_MODULE.get(block["name"])\n    if fragment:\n        out.append("    vintf_fragments: [")\n        out.append(f'        "{fragment}",')\n        out.append("    ],")\n    out.append("    target: {")\n'''
              if marker not in source:
                  raise SystemExit('render_block anchor not found')
              source = source.replace(marker, replacement, 1)
          generator.write_text(source)

          docs = '''# RED Hydrogen One Android 15 proprietary VINTF contract\n\n**Stock authority:** RED `.118` (`7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e`)  \n**Target:** LineageOS 22.2 / Android 15 API 35\n\nThis contract declares only proprietary HAL instances that still have a retained RED service owner after Android 15 pruning. Source-owned standard GNSS (`android.hardware.gnss`) and NFC (`android.hardware.nfc`) are deliberately excluded because `device/red/hydrogenone` selects the LineageOS/QTI source services.\n\nThe retained proprietary contract contains **35 exact stock fqnames** across fingerprint, Bluetooth/FM/ANT, OMX, Wi-Fi display, RED thermal3d/Leia display, eSE, and radio/IMS/UIM services. `VINTF_PROPRIETARY_CONTRACT.json` is the machine-readable source of the module → fragment → HAL mapping.\n\nEach fragment is attached to the service module through `vintf_fragments` in the generated `Android.bp`; `tools/generate_elf_contract.py` owns that mapping so ELF regeneration cannot silently drop VINTF metadata.\n\nThe radio fragment records the exact `.118` versions/instances implemented by the retained Qualcomm radio stack. It does not invent linked-but-undeclared interfaces such as `vendor.qti.hardware.data.connection`. Runtime startup/trigger validation remains a separate radio bring-up gate.\n'''
          Path('docs/ANDROID15_VINTF_CONTRACT.md').write_text(docs)
          PY

      - name: Regenerate ELF modules with VINTF metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_elf_contract.py

      - name: Verify VINTF and complete vendor contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool VINTF_PROPRIETARY_CONTRACT.json >/dev/null
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
          grep -Fq 'vintf/fingerprint.xml' Android.bp
          grep -Fq 'vintf/radio.xml' Android.bp
          ! grep -R '<name>android.hardware.gnss</name>' vintf
          ! grep -R '<name>android.hardware.nfc</name>' vintf

      - name: Commit verified VINTF checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-vintf-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'vendor: add verified proprietary VINTF contract'
          git push origin HEAD:lineage-22.2-android15-contract
