name: Restore verified RED P0 daemon closure

on:
  push:
    branches:
      - lineage-22.2-android15-contract
    paths:
      - .github/workflows/restore-p0-daemons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct canonical RED .118 stock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r118/parts"
          ids=(
            1_B7suPmaiZsibKtmSg_IfIcgGaPz4nvt
            1AV1tt-lmg5z0MMn7aNKArS7bFfK8VHCp
            1wxs2du2Ml_--JrOwGlyDb49QMlrPxVMB
            1OMvS4diiiOCiX-yCKHH7HZKv77QaUCFn
            18czKWOxP9Xiw5g6ljCHI1Gt68Ynzxfi4
            19bMHqds6-PsYPtrs18okJ8XgdF85Z84L
            1xKaDVx16zH11ozeSeOjSlldi1-xrHcuj
            1XF4fPiTXBzVsVQU5I3VZGxw4Xm_T_DUe
          )
          sizes=(251658240 251658240 251658240 251658240 251658240 251658240 251658240 89063443)
          for i in "${!ids[@]}"; do
            out="$RUNNER_TEMP/r118/parts/part.$i"
            url="https://drive.usercontent.google.com/download?id=${ids[$i]}&export=download&confirm=t"
            curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$url" --output "$out"
            test "$(stat -c %s "$out")" = "${sizes[$i]}"
          done
          cat "$RUNNER_TEMP"/r118/parts/part.* > "$RUNNER_TEMP/r118/stock.rar"
          echo '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e  '"$RUNNER_TEMP/r118/stock.rar" | sha256sum -c -

      - name: Extract exact RED daemon payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/7zip.tar.xz"
          mkdir -p "$RUNNER_TEMP/7zip" "$RUNNER_TEMP/r118/vendor" "$RUNNER_TEMP/r118/extracted"
          tar -xJf "$RUNNER_TEMP/7zip.tar.xz" -C "$RUNNER_TEMP/7zip"
          chmod +x "$RUNNER_TEMP/7zip/7zz"
          seven="$RUNNER_TEMP/7zip/7zz"
          archive_path='H1A1000.082ho.01.00.10r.118_userdebug_fastboot/fastboot/vendor.img'
          "$seven" e -y -o"$RUNNER_TEMP/r118/vendor" "$RUNNER_TEMP/r118/stock.rar" "$archive_path"
          test "$(stat -c %s "$RUNNER_TEMP/r118/vendor/vendor.img")" = 593264872

          for path in bin/spdaemon lib64/libspcom.so bin/hvdcp_opti bin/energy-awareness; do
            "$seven" x -y -o"$RUNNER_TEMP/r118/extracted" "$RUNNER_TEMP/r118/vendor/vendor.img" "$path"
          done

          echo 'a157a177f899ad1783945b88fbe3cb2ddae35ea480d8595b5ddcac91ea16886d  '"$RUNNER_TEMP/r118/extracted/bin/spdaemon" | sha256sum -c -
          echo '3f9e7b0ecd2ffd999ef58077a15fffa780754dd0f4fb0ae2d8eb49adbe924c4c  '"$RUNNER_TEMP/r118/extracted/lib64/libspcom.so" | sha256sum -c -
          echo '4d1d5a97f2da8840912ffdb8351a20b278905ebd4f471cfdee81c4052cc80a03  '"$RUNNER_TEMP/r118/extracted/bin/hvdcp_opti" | sha256sum -c -
          echo '2b1ae7f5ef59b9a7518b3eabd4823eac5cce51330069f75bd120bcfc30767158  '"$RUNNER_TEMP/r118/extracted/bin/energy-awareness" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/r118/extracted/bin/spdaemon")" = 68656
          test "$(stat -c %s "$RUNNER_TEMP/r118/extracted/lib64/libspcom.so")" = 68464
          test "$(stat -c %s "$RUNNER_TEMP/r118/extracted/bin/hvdcp_opti")" = 202720
          test "$(stat -c %s "$RUNNER_TEMP/r118/extracted/bin/energy-awareness")" = 70120

          install -D -m 0755 "$RUNNER_TEMP/r118/extracted/bin/spdaemon" proprietary/vendor/bin/spdaemon
          install -D -m 0644 "$RUNNER_TEMP/r118/extracted/lib64/libspcom.so" proprietary/vendor/lib64/libspcom.so
          install -D -m 0755 "$RUNNER_TEMP/r118/extracted/bin/hvdcp_opti" proprietary/vendor/bin/hvdcp_opti
          install -D -m 0755 "$RUNNER_TEMP/r118/extracted/bin/energy-awareness" proprietary/vendor/bin/energy-awareness

      - name: Add exact stock metadata and seed Soong modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          entries = [
              {"tier":"P0","path":"vendor/bin/spdaemon","size":68656,"sha256":"a157a177f899ad1783945b88fbe3cb2ddae35ea480d8595b5ddcac91ea16886d"},
              {"tier":"P0","path":"vendor/lib64/libspcom.so","size":68464,"sha256":"3f9e7b0ecd2ffd999ef58077a15fffa780754dd0f4fb0ae2d8eb49adbe924c4c"},
              {"tier":"P0","path":"vendor/bin/hvdcp_opti","size":202720,"sha256":"4d1d5a97f2da8840912ffdb8351a20b278905ebd4f471cfdee81c4052cc80a03"},
              {"tier":"P0","path":"vendor/bin/energy-awareness","size":70120,"sha256":"2b1ae7f5ef59b9a7518b3eabd4823eac5cce51330069f75bd120bcfc30767158"},
          ]
          paths = {e['path'] for e in entries}

          prop = Path('proprietary-files.txt')
          text = prop.read_text()
          existing = {
              line.strip().split(';',1)[0].split(':',1)[0].lstrip('-')
              for line in text.splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          }
          missing = [e['path'] for e in entries if e['path'] not in existing]
          if missing:
              text = text.rstrip() + '\n\n# P0 Android 15 daemon closure restored from verified RED .118\n' + '\n'.join(missing) + '\n'
              prop.write_text(text)

          manifest_path = Path('proprietary-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          by_path = {e['path']: e for e in manifest['files']}
          for e in entries:
              by_path[e['path']] = e
          order = {'P0':0,'P1':1,'P2':2}
          files = sorted(by_path.values(), key=lambda e:(order[e['tier']], e['path']))
          manifest['files'] = files
          counts = {tier: sum(1 for e in files if e['tier']==tier) for tier in ('P0','P1','P2')}
          counts['total'] = len(files)
          manifest['counts'] = counts
          contract = manifest.setdefault('android15_contract', {})
          contract['p0_daemon_closure_restored'] = sorted(paths)
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          lock_path = Path('SOURCE_LOCK.json')
          lock = json.loads(lock_path.read_text())
          lock['selected_files'] = len(files)
          lock.setdefault('android15_contract', {})['p0_daemon_closure_restored_from_red_118'] = True
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          total_bytes = sum(int(e['size']) for e in files)
          generated_path = Path('GENERATED_VENDOR_AUDIT.json')
          generated = json.loads(generated_path.read_text())
          generated.update({
              'selected_files': len(files),
              'p0': counts['P0'],
              'p1': counts['P1'],
              'p2': counts['P2'],
              'selected_bytes': total_bytes,
              'missing_files': [],
              'duplicate_paths': 0,
          })
          generated_path.write_text(json.dumps(generated, indent=2) + '\n')

          tree_path = Path('VENDOR_TREE_AUDIT.json')
          tree = json.loads(tree_path.read_text())
          tree['counts'] = counts
          notes = [n for n in tree.get('notes', []) if 'proprietary ELF modules have check_elf_files enabled' not in n]
          note = 'RED .118 P0 daemon closure restores spdaemon/libspcom, hvdcp_opti, and energy-awareness required by the Android 15 rootdir contract.'
          if note not in notes:
              notes.append(note)
          tree['notes'] = notes
          tree_path.write_text(json.dumps(tree, indent=2) + '\n')

          bp = Path('Android.bp')
          bp_text = bp.read_text().rstrip() + '\n\n'
          seeds = {
              'spdaemon': '''cc_prebuilt_binary {\n    name: "spdaemon",\n    owner: "red",\n    strip: { none: true },\n    target: { android_arm64: { srcs: ["proprietary/vendor/bin/spdaemon"], }, },\n    compile_multilib: "64",\n    prefer: true,\n    soc_specific: true,\n}\n''',
              'libspcom': '''cc_prebuilt_library_shared {\n    name: "libspcom",\n    owner: "red",\n    strip: { none: true },\n    target: { android_arm64: { srcs: ["proprietary/vendor/lib64/libspcom.so"], }, },\n    compile_multilib: "64",\n    prefer: true,\n    soc_specific: true,\n}\n''',
              'hvdcp_opti': '''cc_prebuilt_binary {\n    name: "hvdcp_opti",\n    owner: "red",\n    strip: { none: true },\n    target: { android_arm64: { srcs: ["proprietary/vendor/bin/hvdcp_opti"], }, },\n    compile_multilib: "64",\n    prefer: true,\n    soc_specific: true,\n}\n''',
              'energy-awareness': '''cc_prebuilt_binary {\n    name: "energy-awareness",\n    owner: "red",\n    strip: { none: true },\n    target: { android_arm64: { srcs: ["proprietary/vendor/bin/energy-awareness"], }, },\n    compile_multilib: "64",\n    prefer: true,\n    soc_specific: true,\n}\n''',
          }
          for name, block in seeds.items():
              if f'name: "{name}"' not in bp_text:
                  bp_text += block + '\n'
          bp.write_text(bp_text)

          mk = Path('hydrogenone-vendor.mk')
          mk_text = mk.read_text().rstrip() + '\n\n# RED .118 P0 daemon closure\nPRODUCT_PACKAGES += \\\n    energy-awareness \\\n    hvdcp_opti \\\n    libspcom \\\n    spdaemon\n'
          mk.write_text(mk_text)
          PY

      - name: Regenerate exact ELF dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_elf_contract.py

      - name: Verify complete P0 daemon contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool proprietary-manifest.json >/dev/null
          python3 -m json.tool SOURCE_LOCK.json >/dev/null
          python3 -m json.tool GENERATED_VENDOR_AUDIT.json >/dev/null
          python3 -m json.tool VENDOR_TREE_AUDIT.json >/dev/null
          python3 -m json.tool ANDROID15_ELF_AUDIT.json >/dev/null
          python3 -m json.tool ANDROID15_ELF_EXCEPTIONS.json >/dev/null
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('proprietary-manifest.json').read_text())
          assert manifest['counts']['total'] == 501, manifest['counts']
          assert manifest['counts']['P0'] == 108, manifest['counts']
          audit=json.loads(Path('GENERATED_VENDOR_AUDIT.json').read_text())
          assert audit['missing_files'] == []
          assert audit['duplicate_paths'] == 0
          exceptions=json.loads(Path('ANDROID15_ELF_EXCEPTIONS.json').read_text())['exceptions']
          for module in ('spdaemon','libspcom','hvdcp_opti','energy-awareness'):
              assert module not in exceptions, (module, exceptions.get(module))
          PY

      - name: Commit verified RED daemon closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-p0-daemons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'vendor: restore verified RED P0 daemon closure'
          git push origin HEAD:lineage-22.2-android15-contract
