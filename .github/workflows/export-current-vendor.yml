name: Export exact vendor checkpoint for P0 completion

on:
  push:
    branches:
      - lineage-22.2-android15-contract
    paths:
      - .github/workflows/export-current-vendor.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package exact checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/vendor-current.tar.gz" .
          sha256sum "$RUNNER_TEMP/vendor-current.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-current-p0
          path: ${{ runner.temp }}/vendor-current.tar.gz
          retention-days: 1
          if-no-files-found: error
