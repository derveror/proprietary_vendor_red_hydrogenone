name: Apply verified RED P0 daemon completion

on:
  push:
    branches:
      - lineage-22.2-android15-contract
    paths:
      - .github/workflows/apply-p0-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified RED .118 stock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r118/parts"
          ids=(
            1_B7suPmaiZsibKtmSg_IfIcgGaPz4nvt
            1AV1tt-lmg5z0MMn7aNKArS7bFfK8VHCp
            1wxs2du2Ml_--JrOwGlyDb49QMlrPxVMB
            1OMvS4diiiOCiX-yCKHH7HZKv77QaUCFn
            18czKWOxP9Xiw5g6ljCHI1Gt68Ynzxfi4
            19bMHqds6-PsYPtrs18okJ8XgdF85Z84L
            1xKaDVx16zH11ozeSeOjSlldi1-xrHcuj
            1XF4fPiTXBzVsVQU5I3VZGxw4Xm_T_DUe
          )
          sizes=(251658240 251658240 251658240 251658240 251658240 251658240 251658240 89063443)
          for i in "${!ids[@]}"; do
            out="$RUNNER_TEMP/r118/parts/part.$i"
            url="https://drive.usercontent.google.com/download?id=${ids[$i]}&export=download&confirm=t"
            curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$url" --output "$out"
            test "$(stat -c %s "$out")" = "${sizes[$i]}"
          done
          cat "$RUNNER_TEMP"/r118/parts/part.* > "$RUNNER_TEMP/r118/stock.rar"
          echo '7277a1accf9595bb727f2189863cf5f6249dd99322e2953432bca6e448365f1e  '"$RUNNER_TEMP/r118/stock.rar" | sha256sum -c -

      - name: Extract exact P0 daemon payload
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 \
            https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz \
            --output "$RUNNER_TEMP/7zip.tar.xz"
          mkdir -p "$RUNNER_TEMP/7zip" "$RUNNER_TEMP/r118/vendor" "$RUNNER_TEMP/r118/extracted"
          tar -xJf "$RUNNER_TEMP/7zip.tar.xz" -C "$RUNNER_TEMP/7zip"
          chmod +x "$RUNNER_TEMP/7zip/7zz"
          seven="$RUNNER_TEMP/7zip/7zz"
          archive_path='H1A1000.082ho.01.00.10r.118_userdebug_fastboot/fastboot/vendor.img'
          "$seven" e -y -o"$RUNNER_TEMP/r118/vendor" "$RUNNER_TEMP/r118/stock.rar" "$archive_path"
          test "$(stat -c %s "$RUNNER_TEMP/r118/vendor/vendor.img")" = 593264872
          for path in bin/spdaemon lib64/libspcom.so bin/hvdcp_opti bin/energy-awareness; do
            "$seven" x -y -o"$RUNNER_TEMP/r118/extracted" "$RUNNER_TEMP/r118/vendor/vendor.img" "$path"
          done
          echo 'a157a177f899ad1783945b88fbe3cb2ddae35ea480d8595b5ddcac91ea16886d  '"$RUNNER_TEMP/r118/extracted/bin/spdaemon" | sha256sum -c -
          echo '3f9e7b0ecd2ffd999ef58077a15fffa780754dd0f4fb0ae2d8eb49adbe924c4c  '"$RUNNER_TEMP/r118/extracted/lib64/libspcom.so" | sha256sum -c -
          echo '4d1d5a97f2da8840912ffdb8351a20b278905ebd4f471cfdee81c4052cc80a03  '"$RUNNER_TEMP/r118/extracted/bin/hvdcp_opti" | sha256sum -c -
          echo '2b1ae7f5ef59b9a7518b3eabd4823eac5cce51330069f75bd120bcfc30767158  '"$RUNNER_TEMP/r118/extracted/bin/energy-awareness" | sha256sum -c -
          install -D -m 0755 "$RUNNER_TEMP/r118/extracted/bin/spdaemon" proprietary/vendor/bin/spdaemon
          install -D -m 0644 "$RUNNER_TEMP/r118/extracted/lib64/libspcom.so" proprietary/vendor/lib64/libspcom.so
          install -D -m 0755 "$RUNNER_TEMP/r118/extracted/bin/hvdcp_opti" proprietary/vendor/bin/hvdcp_opti
          install -D -m 0755 "$RUNNER_TEMP/r118/extracted/bin/energy-awareness" proprietary/vendor/bin/energy-awareness

      - name: Apply deterministic P0 metadata and Soong modules
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_p0_daemon_completion.py
          python3 tools/generate_elf_contract.py

      - name: Verify complete vendor contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m json.tool proprietary-manifest.json >/dev/null
          python3 -m json.tool GENERATED_VENDOR_AUDIT.json >/dev/null
          python3 -m json.tool ANDROID15_ELF_AUDIT.json >/dev/null
          python3 -m json.tool ANDROID15_ELF_EXCEPTIONS.json >/dev/null
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('proprietary-manifest.json').read_text())
          a=json.loads(Path('GENERATED_VENDOR_AUDIT.json').read_text())
          e=json.loads(Path('ANDROID15_ELF_AUDIT.json').read_text())['summary']
          x=json.loads(Path('ANDROID15_ELF_EXCEPTIONS.json').read_text())['exceptions']
          assert m['counts'] == {'P0':108,'P1':376,'P2':17,'total':501}, m['counts']
          assert a['missing_files'] == [] and a['duplicate_paths'] == 0, a
          assert e == {'total_modules':338,'checkelf_enabled':320,'checkelf_exceptions':18,'provider_sonames':308}, e
          for module in ('spdaemon','libspcom','hvdcp_opti','energy-awareness'):
              assert module not in x, (module, x.get(module))
          PY

      - name: Commit payload without modifying workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Android.bp hydrogenone-vendor.mk proprietary-files.txt proprietary-manifest.json \
            SOURCE_LOCK.json GENERATED_VENDOR_AUDIT.json VENDOR_TREE_AUDIT.json \
            ANDROID15_ELF_AUDIT.json ANDROID15_ELF_EXCEPTIONS.json \
            docs/ANDROID15_P0_DAEMONS.md proprietary/vendor/bin/spdaemon \
            proprietary/vendor/bin/hvdcp_opti proprietary/vendor/bin/energy-awareness \
            proprietary/vendor/lib64/libspcom.so
          git diff --cached --check
          git commit -m 'vendor: complete RED .118 P0 daemon contract'
          git push origin HEAD:lineage-22.2-android15-contract
