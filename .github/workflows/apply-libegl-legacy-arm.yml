name: Apply RED libEGL legacy ARM contract

on:
  push:
    branches:
      - codex/libegl-legacy-arm-staging

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/libegl-legacy-arm-staging
          fetch-depth: 0

      - name: Add precise RED libEGL ARM compatibility contract
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/generate_elf_contract.py')
          text = path.read_text(encoding='utf-8')

          if '"libEGL_adreno": {' not in text:
              anchor = '''    "libgsl": {
                  "arch": "android_arm",
                  "path": "proprietary/vendor/lib/libgsl.so",
                  "sha256": "dc22e2b816dcb16a49797b9c758a2872ffa65a3bb4871a2b50b5866dcc4573cb",
                  "symbols": ["__aeabi_uldivmod"],
                  "runtime_provider": "libc.so",
              },
          '''
              replacement = anchor + '''    "libEGL_adreno": {
                  "arch": "android_arm",
                  "path": "proprietary/vendor/lib/egl/libEGL_adreno.so",
                  "sha256": "dcac93072d761bbbe5f36c72d7823901be4f47ddf23d3c32a6d103416cb50fa0",
                  "symbols": ["__aeabi_ldivmod"],
                  "runtime_provider": "libc.so",
              },
          '''
              if anchor not in text:
                  raise SystemExit('legacy runtime contract anchor missing')
              text = text.replace(anchor, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_libegl_legacy_aeabi_contract.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          RED_LIBEGL_ARM = ROOT / "proprietary/vendor/lib/egl/libEGL_adreno.so"
          EXPECTED_SHA256 = "dcac93072d761bbbe5f36c72d7823901be4f47ddf23d3c32a6d103416cb50fa0"


          def prebuilt_block(name: str) -> str:
              text = (ROOT / "Android.bp").read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines):
                  if not re.match(r"^cc_prebuilt_(?:binary|library_shared)\s*\{\s*$", line):
                      continue
                  depth = line.count("{") - line.count("}")
                  j = i + 1
                  while j < len(lines) and depth > 0:
                      depth += lines[j].count("{") - lines[j].count("}")
                      j += 1
                  block = "".join(lines[i:j])
                  if re.search(rf'(?m)^\s*name:\s*"{re.escape(name)}"\s*,?$', block):
                      return block
              raise AssertionError(f"missing prebuilt block: {name}")


          class LibeglLegacyAeabiContractTest(unittest.TestCase):
              def test_red_arm_libegl_has_precise_legacy_undefined_symbol_allowance(self) -> None:
                  self.assertTrue(RED_LIBEGL_ARM.is_file())
                  self.assertEqual(hashlib.sha256(RED_LIBEGL_ARM.read_bytes()).hexdigest(), EXPECTED_SHA256)
                  block = prebuilt_block("libEGL_adreno")
                  self.assertNotIn("check_elf_files: false", block)
                  self.assertRegex(block, r"(?s)arch:\s*\{.*?arm:\s*\{.*?allow_undefined_symbols:\s*true,.*?\}.*?\}")
                  arch_block = re.search(r"(?s)\n    arch:\s*\{\n(.*?)\n    \},\n    compile_multilib", block)
                  self.assertIsNotNone(arch_block)
                  self.assertNotIn("arm64:", arch_block.group(1))

              def test_audit_records_only_the_legacy_arm_runtime_symbol_allowance(self) -> None:
                  audit = json.loads((ROOT / "ANDROID15_ELF_AUDIT.json").read_text(encoding="utf-8"))
                  module = audit["modules"]["libEGL_adreno"]
                  self.assertEqual(module.get("allowed_undefined_symbols"), {"android_arm": ["__aeabi_ldivmod"]})
                  self.assertEqual(module.get("undefined_symbol_runtime_providers"), {"android_arm": {"__aeabi_ldivmod": "libc.so"}})
                  self.assertTrue(module["check_elf_files"])


          if __name__ == "__main__":
              unittest.main()
          PY

          python3 tools/generate_elf_contract.py
          sha256sum Android.bp ANDROID15_ELF_AUDIT.json > /tmp/before-second.txt
          python3 tools/generate_elf_contract.py
          sha256sum Android.bp ANDROID15_ELF_AUDIT.json > /tmp/after-second.txt
          diff -u /tmp/before-second.txt /tmp/after-second.txt

          python3 -m unittest tests.test_libegl_legacy_aeabi_contract -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit verified libEGL contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Android.bp ANDROID15_ELF_AUDIT.json tools/generate_elf_contract.py tests/test_libegl_legacy_aeabi_contract.py
          git diff --cached --quiet && { echo "Expected libEGL changes but found none"; exit 1; }
          git commit -m "vendor: allow RED libEGL legacy ARM runtime helper"
          git push origin HEAD:codex/libegl-legacy-arm-staging
