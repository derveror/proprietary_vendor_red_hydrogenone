name: Scan legacy HIDL compatibility consumers

on:
  push:
    branches:
      - codex/lineage-22.2-bringup-audit

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Scan selected RED ELF payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          symbols = {
              'GBN': '_ZN7android8hardware7details17gBnConstructorMapE',
              'GBS': '_ZN7android8hardware7details17gBsConstructorMapE',
              'PARCEL_SETDATA': '_ZN7android8hardware6Parcel7setDataEPKhm',
          }
          root = Path('.')
          manifest = json.loads((root / 'proprietary-manifest.json').read_text())
          hits = {name: [] for name in symbols}
          union = set()

          for entry in manifest['files']:
              rel = entry['path']
              path = root / 'proprietary' / rel
              if not path.is_file():
                  continue
              with path.open('rb') as fh:
                  if fh.read(4) != b'\x7fELF':
                      continue
              dynsyms = subprocess.run(
                  ['readelf', '--dyn-syms', '--wide', str(path)],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              needed = None
              for name, symbol in symbols.items():
                  matching = [
                      line for line in dynsyms.splitlines()
                      if ' UND ' in line and symbol in line
                  ]
                  if not matching:
                      continue
                  if needed is None:
                      needed = subprocess.run(
                          ['readelf', '-d', str(path)],
                          check=True,
                          capture_output=True,
                          text=True,
                      ).stdout
                  hits[name].append((rel, 'libhidlbase_shim.so' in needed))
                  union.add(rel)

          for name in symbols:
              print(f'{name}_CONSUMERS={len(hits[name])}')
              for rel, already in hits[name]:
                  print(f'{name}_CONSUMER {rel} shim={str(already).lower()}')
          print(f'HIDL_SHIM_UNION={len(union)}')
          for rel in sorted(union):
              print(f'HIDL_SHIM_CONSUMER {rel}')
          PY
