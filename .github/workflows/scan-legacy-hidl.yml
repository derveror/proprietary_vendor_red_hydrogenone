name: Apply legacy HIDL compatibility fixups

on:
  push:
    branches:
      - codex/lineage-22.2-bringup-audit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout RED vendor tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout LineageOS 22.2 extract tools
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_extract-tools
          ref: lineage-22.2
          path: .extract-tools
          fetch-depth: 1

      - name: Record pre-fixup regression state
        shell: bash
        run: |
          set -euo pipefail
          if PYTHONPATH="$PWD" python3 -m unittest -v tests.test_legacy_hidl_shim_contract; then
              echo "Legacy HIDL shim contract already green"
          else
              echo "Expected pre-fixup RED state observed"
          fi

      - name: Apply exact RED .118 HIDL shim fixups
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_legacy_hidl_shim.py \
              --payload-only \
              --patchelf "$PWD/.extract-tools/linux-x86/bin/patchelf-0_18"
          rm -rf .extract-tools

      - name: Verify payload fixup registry and DT_NEEDED
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python3 -m unittest -v tests.test_legacy_hidl_shim_contract
          python3 -m json.tool ANDROID15_BLOB_FIXUPS.json >/dev/null
          git diff --check

      - name: Commit patched payload when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ANDROID15_BLOB_FIXUPS.json proprietary/
          if git diff --cached --quiet; then
              echo "HIDL shim payload already canonical"
              exit 0
          fi
          git commit -m "vendor: add Lineage HIDL compatibility shim dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
